[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "syzygy-coauthor"
version = "1.0.0"
description = "AI-Human Co-Authorship Scaffold — Trivian Institute"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["ai", "co-authorship", "human-ai", "trivian", "coevolution"]

[project.scripts]
syzygy-coauthor = "syzygy_coauthor.cli:main"

[tool.setuptools.packages.find]
where = ["."]
