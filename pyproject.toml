[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "syzygy-coauthor"
version = "1.1.0"
description = "Human-AI co-authorship scaffold with provenance and dominance visibility"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Sarasha Elion" }]
keywords = ["ai", "co-authorship", "human-ai", "trivian", "provenance", "relational-ai"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]

[project.scripts]
syzygy-coauthor = "syzygy_coauthor.cli:main"

[tool.setuptools.packages.find]
where = ["."]
